# Background work: outbox publisher, inbox processor, carrier retry/poll,
# MTO pipeline, reconciliation and retention jobs, plus event subscribers.
# No public traffic. Replicas are safe because work is claimed with
# FOR UPDATE SKIP LOCKED and every side effect is idempotent, so scaling out
# only adds throughput.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medusa-worker
  labels: { app.kubernetes.io/name: medusa, app.kubernetes.io/component: worker }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: medusa, app.kubernetes.io/component: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: medusa, app.kubernetes.io/component: worker }
    spec:
      serviceAccountName: fashion-medusa
      # Give in-flight jobs time to finish; unfinished claims are recovered by
      # the inbox visibility timeout and outbox retry anyway.
      terminationGracePeriodSeconds: 60
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: medusa
          image: fashion-medusa
          command: ["npx", "medusa", "start"]
          ports: [{ name: http, containerPort: 9000 }]
          env:
            - { name: MEDUSA_WORKER_MODE, value: worker }
          envFrom:
            - configMapRef: { name: fashion-platform-config }
            - secretRef: { name: fashion-platform-secrets }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: medusa-worker
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: medusa-worker }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: medusa-worker
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: medusa, app.kubernetes.io/component: worker }

<!doctype html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FECS Platform – Kiến trúc as-built (live diagram)</title>
<style>
:root{
  --bg:#0d1117; --bg2:#11161d; --panel:#151b23; --line:#2d333b; --text:#e6edf3; --muted:#9aa4b2;
  --accent:#58a6ff; --danger:#f85149; --warn:#d29922; --ok:#3fb950;
  --c-http:#58a6ff; --c-event:#bc8cff; --c-webhook:#f0883e; --c-data:#3fb9a8; --c-ops:#8b949e; --c-trans:#79c0ff;
  --t-actor:#a371f7; --t-edge:#d29922; --t-app:#58a6ff; --t-cms:#f778ba; --t-mod:#3fb950;
  --t-data:#2ea6a6; --t-ext:#8b949e; --t-ops:#f0883e; --t-state:#58a6ff; --t-note:#6e7681;
  --fill-mix:14%; --zone:#ffffff08; --zone-line:#3a424d; --label-bg:#0d1117;
}
[data-theme="light"]{
  --bg:#f6f8fa; --bg2:#eef1f5; --panel:#ffffff; --line:#d0d7de; --text:#1f2328; --muted:#59636e;
  --accent:#0969da; --danger:#cf222e; --warn:#9a6700; --ok:#1a7f37;
  --c-http:#0969da; --c-event:#8250df; --c-webhook:#bc4c00; --c-data:#116e63; --c-ops:#57606a; --c-trans:#0550ae;
  --t-actor:#8250df; --t-edge:#9a6700; --t-app:#0969da; --t-cms:#bf3989; --t-mod:#1a7f37;
  --t-data:#0f766e; --t-ext:#57606a; --t-ops:#bc4c00; --t-state:#0969da; --t-note:#6e7781;
  --fill-mix:12%; --zone:#00000005; --zone-line:#c4ccd4; --label-bg:#f6f8fa;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);
  display:grid;grid-template-rows:auto auto auto minmax(0,1fr)}
button,select,input{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg2)}
header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
header h1 small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.spacer{flex:1}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 22%,var(--panel));border-color:var(--accent)}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=search]{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;width:190px}
select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
nav.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--bg2)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.sub{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);min-height:44px}
.sub .intro{color:var(--muted);font-size:13px;flex:1;min-width:260px}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 10px 2px 8px;font-size:12px;cursor:pointer}
.chip i{display:inline-block;width:18px;height:0;border-top:2px solid currentColor}
.chip.off{opacity:.4;text-decoration:line-through}
main{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}
#stage{position:relative;min-height:0;overflow:hidden;background:
  radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0) 0 0/26px 26px}
#stage svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#stage svg.dragging{cursor:grabbing}
#stage .risks-view{position:absolute;inset:0;overflow:auto;padding:16px 20px;background:var(--bg)}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px 18px;min-height:0}
aside h2{font-size:16px;margin:0 0 2px}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:16px 0 4px}
aside p{margin:4px 0}
aside ul{margin:4px 0;padding-left:18px}
aside code,.mono{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:color-mix(in srgb,var(--line) 55%,transparent);padding:1px 5px;border-radius:4px;word-break:break-all}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 6px;margin:2px 4px 2px 0;color:var(--muted)}
.sev{font-size:11px;font-weight:700;border-radius:4px;padding:0 6px;margin-right:6px;color:#fff}
.sev.High{background:var(--danger)} .sev.Medium{background:#b08800} .sev.Low{background:#57606a}
.riskrow{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;cursor:pointer;background:var(--bg2)}
.riskrow:hover{border-color:var(--accent)}
.hint{color:var(--muted);font-size:12px}
.stepbar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
table.rt{border-collapse:collapse;width:100%;font-size:13px}
table.rt th,table.rt td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.rt th{position:sticky;top:-16px;background:var(--bg);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
table.rt tr:hover td{background:color-mix(in srgb,var(--accent) 7%,transparent)}
/* ---- svg ---- */
.zone rect{fill:var(--zone);stroke:var(--zone-line);stroke-dasharray:6 5;rx:14}
.zone text{fill:var(--muted);font-size:12px;font-weight:600}
.zone rect.zl{fill:var(--label-bg);stroke:none;stroke-dasharray:none;opacity:.92}
.node{cursor:pointer;outline:none}
.node rect.body{fill:color-mix(in srgb,var(--tc) var(--fill-mix),var(--bg));stroke:var(--tc);stroke-width:1.5;rx:10;transition:stroke-width .12s}
.node:hover rect.body,.node:focus-visible rect.body,.node.sel rect.body{stroke-width:3}
.node.dashed rect.body{stroke-dasharray:6 4}
.node text{fill:var(--text);pointer-events:none}
.node .nt{font-size:13px;font-weight:650}
.node .ns{font-size:11px;fill:var(--muted)}
.node .stripe{fill:var(--tc);opacity:.9}
.node .go{fill:var(--tc);font-size:12px}
.t-actor{--tc:var(--t-actor)} .t-edge{--tc:var(--t-edge)} .t-app{--tc:var(--t-app)} .t-cms{--tc:var(--t-cms)}
.t-mod{--tc:var(--t-mod)} .t-data{--tc:var(--t-data)} .t-ext{--tc:var(--t-ext)} .t-ops{--tc:var(--t-ops)}
.t-state{--tc:var(--t-state)} .t-note{--tc:var(--t-note)}
.badge circle{fill:var(--danger);stroke:var(--bg);stroke-width:2}
.badge.m circle{fill:#b08800}.badge.l circle{fill:#57606a}
.badge text{fill:#fff;font-size:11px;font-weight:700;text-anchor:middle;pointer-events:none}
.risks-off .badge{display:none}
.edge path.base{fill:none;stroke:var(--ec);stroke-width:1.8;stroke-linejoin:round}
.edge path.hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.edge path.pulse{fill:none;stroke:var(--ec);stroke-width:4.5;stroke-linecap:round;stroke-dasharray:1 26;opacity:0;pointer-events:none}
.anim .edge path.pulse{opacity:.95;animation:flow 1.1s linear infinite}
.edge.rev path.pulse{animation-direction:reverse}
@keyframes flow{to{stroke-dashoffset:-27}}
@media (prefers-reduced-motion:reduce){.anim .edge path.pulse{animation:none;opacity:0}}
.edge .lbl rect{fill:var(--label-bg);stroke:var(--ec);stroke-width:1;rx:5;opacity:.97}
.edge .lbl text{fill:var(--text);font-size:11px;text-anchor:middle;pointer-events:none}
.edge{--ec:var(--c-http)}
.k-http{--ec:var(--c-http)} .k-event{--ec:var(--c-event)} .k-webhook{--ec:var(--c-webhook)}
.k-data{--ec:var(--c-data)} .k-ops{--ec:var(--c-ops)} .k-trans{--ec:var(--c-trans)}
.k-event path.base{stroke-dasharray:8 5} .k-webhook path.base{stroke-dasharray:2 5;stroke-width:2.4;stroke-linecap:round}
.k-data path.base{stroke-width:1.6} .k-ops path.base{stroke-dasharray:3 4;stroke-width:1.3}
.edge.sel path.base{stroke-width:3.4}
.m-fill{fill:var(--ec)}
.mk-http{fill:var(--c-http)} .mk-event{fill:var(--c-event)} .mk-webhook{fill:var(--c-webhook)}
.mk-data{fill:var(--c-data)} .mk-ops{fill:var(--c-ops)} .mk-trans{fill:var(--c-trans)}
.has-focus .node:not(.hl){opacity:.22}
.has-focus .edge:not(.hl){opacity:.1}
.has-focus .zone{opacity:.6}
.node.dim{opacity:.15}
.edge.dim{opacity:.08}
.seq-life{stroke:var(--line);stroke-dasharray:4 6}
.seq-msg{cursor:pointer}
.seq-msg.dim{opacity:.22}
.seq-msg .line{stroke:var(--ec);stroke-width:1.8;fill:none}
.seq-msg.k-event .line{stroke-dasharray:8 5}
.seq-msg.k-webhook .line{stroke-dasharray:2 5;stroke-linecap:round}
.seq-msg .no circle{fill:var(--ec)} .seq-msg .no text{fill:#fff;font-size:11px;font-weight:700;text-anchor:middle}
.seq-msg .t{fill:var(--text);font-size:12px}
.seq-msg .tb{fill:var(--label-bg);opacity:.92}
.seq-msg.cur .line{stroke-width:3.2}
.seq-note text{fill:var(--muted);font-size:11px}
.state .node rect.body{rx:18}
.edge.faded{opacity:.28}
.state .edge{opacity:.55}
.state .edge.hl{opacity:1}
.state .edge.hl path.base{stroke-width:2.6}
.chip.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 20%,var(--panel))}
@media (max-width:1000px){main{grid-template-columns:1fr;grid-template-rows:minmax(380px,60vh) auto}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>

<header>
  <h1>FECS Platform – kiến trúc as-built<small>Dựng từ source code (commit <span class="mono">5138517</span>) · xem kèm <span class="mono">Fashion_Platform_Technical_Design_Document_v2.0_as-built.md</span></small></h1>
  <div class="spacer"></div>
  <div class="ctl">
    <input id="q" type="search" placeholder="Tìm node (vd. outbox, J&amp;T)…" aria-label="Tìm node">
    <button class="btn" id="b-anim" aria-pressed="false" title="Hiện dòng chảy dữ liệu trên các cạnh">Dòng chảy</button>
    <button class="btn" id="b-risk" aria-pressed="false" title="Hiện huy hiệu rủi ro trên node">Rủi ro</button>

<script>
(() => {
'use strict';

/* =====================================================================
   DỮ LIỆU – mọi con số/đường dẫn lấy từ source (commit 5138517).
   ===================================================================== */
const KINDS = {
  http:   { label: 'HTTP / SDK (đồng bộ)' },
  event:  { label: 'Sự kiện / queue (bất đồng bộ)' },
  webhook:{ label: 'Webhook / callback' },
  data:   { label: 'Dữ liệu / lưu trữ' },
  ops:    { label: 'Telemetry / vận hành' },
  trans:  { label: 'Chuyển trạng thái' },
};

const RISKS = {
  'R-01': { sev: 'High', t: '[ĐÃ SỬA trong code, chưa deploy] Payload `products`: create/delete/update field chỉ cần query `?is_from_medusa`',
    d: 'access.create/delete của collection Products trả true nếu request có query `is_from_medusa` (giá trị do client tự đặt), không kiểm tra user hay API key. Bất kỳ ai gọi REST /api/products?is_from_medusa=1 đều tạo/xoá được sản phẩm trong CMS.',
    fix: 'Đã thêm `access/isMedusaRequest.ts`: yêu cầu cờ và `req.user` có role admin (Medusa gửi API key của user admin). Đã test local: code gốc 6/11 kịch bản thất bại, bản vá 11/11 đạt. Cần đảm bảo user giữ PAYLOAD_API_KEY là admin trước khi deploy.',
    src: ['apps/store/src/collections/Products.ts:24,129,177,195,208,334-335'] },
  'R-02': { sev: 'Medium', t: '[ĐÃ SỬA trong code, chưa deploy] Payload admin mở cho mọi user đã đăng nhập',
    d: '`Users.access.admin = authenticated` và `read = authenticated`: user role `public` vẫn vào được /admin và đọc danh sách user. Chỉ `create` bị chặn bằng isAdmin.',
    fix: 'Đã sửa: `admin` chỉ role admin, `read` = isAdminOrSelf. Test hồi quy: `pnpm --filter store check:access` (18 kịch bản, code gốc 9 thất bại, bản vá đạt hết).',
    src: ['apps/store/src/collections/Users/index.ts:11-16'] },
  'R-03': { sev: 'Medium', t: 'Toàn bộ `lib/data/*` đánh dấu "use server"',
    d: 'Mỗi hàm export trở thành Server Action gọi được từ client (kể cả các hàm chỉ đọc như listProducts). Bề mặt tấn công rộng hơn cần thiết, khó kiểm soát input.',
    fix: 'Tách hàm đọc sang module `server-only`; chỉ giữ "use server" cho mutation và validate input bằng zod.',
    src: ['apps/store/src/lib/data/*.ts'] },
  'R-04': { sev: 'Medium', t: 'Cache/hiệu năng storefront: layout chặn 3 lời gọi Medusa, tag `customers` lệch',
    d: '`(main)/layout.tsx` await customer + cart + shipping options cho mọi trang (không Suspense) nên trang nào cũng dynamic. `fetchCachedCustomer` gắn `cacheTag("customers")` nhưng revalidate dùng `customers-<cacheId>` nên không trúng. `retrieveCart` dùng force-cache kèm auth header.',
    fix: 'Đưa fetch vào Suspense/streaming; thống nhất tên tag; xem lại force-cache cho dữ liệu theo user.',
    src: ['apps/store/src/app/[locale]/[countryCode]/(main)/layout.tsx', 'apps/store/src/lib/data/customer.ts:34-62,110-111'] },
  'R-05': { sev: 'Low', t: '`proxy.ts` export `proxyConfig` thay vì `config`',
    d: 'Next chỉ đọc `export const config`. Matcher bị bỏ qua nên proxy chạy trên mọi đường dẫn; hiện chỉ nhờ các early-return đầu hàm mà /admin, /api, static không bị xử lý.',
    fix: 'Đổi tên thành `config`.', src: ['apps/store/src/proxy.ts:274'] },
  'R-06': { sev: 'Medium', t: 'Phụ thuộc không tái lập được',
    d: 'Next 16.3.0-canary.95 ghim canary; `@medusajs/js-sdk|ui|types|icons|ui-preset` ở `latest`; override `undici@5.20.0` (cũ). Docker build đặt `NEXT_IGNORE_TYPE_ERRORS=true` để che ~150 lỗi type (SDK drift).',
    fix: 'Ghim phiên bản Medusa store packages = 2.18.0, chuyển Next sang bản stable, sửa dần lỗi type rồi bỏ cờ.',
    src: ['apps/store/package.json', 'apps/store/next.config.mjs', 'infra/docker/store.Dockerfile'] },
  'R-07': { sev: 'Medium', t: 'CI không phủ storefront; lint không chặn; không có bước deploy',
    d: 'ci.yml chỉ build/test Medusa. Storefront không được build/lint/test trong CI; Playwright e2e không chạy trong CI. `ultracite check` chạy `continue-on-error` vì oxlint config lỗi khi load. Deploy hoàn toàn thủ công qua scripts/deploy.sh.',
    fix: 'Thêm job build storefront + Playwright; sửa oxlint config rồi bỏ continue-on-error; thêm workflow release.',
    src: ['.github/workflows/ci.yml', 'scripts/deploy.sh'] },
  'R-08': { sev: 'Medium', t: 'Đồng bộ Payload ↔ Medusa best-effort',
    d: '`Products.afterChange` cập nhật Medusa qua `@ecommerce/medusa` và chỉ `console.error` khi lỗi; chiều ngược lại dựa vào workflow Payload sync. Không có retry hay job đối soát nên hai hệ thống có thể lệch im lặng.',
    fix: 'Đưa vào hàng đợi bền (outbox) hoặc thêm job reconcile + metric lệch.',
    src: ['apps/store/src/collections/Products.ts:292-330', 'packages/medusa/src'] },
  'R-09': { sev: 'Medium', t: 'Kafka chỉ qua REST proxy và chưa có broker ở môi trường thật',
    d: 'Relay nói giao thức REST proxy (không phải Kafka native). Repo chỉ có Redpanda trong compose e2e; không có Kafka trong K8s lẫn droplet. Outbox publish chạy bên trong DB transaction nên bus chậm sẽ giữ row lock; giao nhận at-least-once nên mọi subscriber phải tự khử trùng lặp (mới xác nhận ở fg-sellable-changed và notify-customer-events).',
    fix: 'Quyết định có dùng Kafka thật không; kiểm toán dedupe của 23 subscriber; cân nhắc claim → publish ngoài transaction.',
    src: ['apps/medusa/src/lib/outbox/outbox.ts', 'apps/medusa/src/lib/outbox/kafka-rest.ts', 'docker/docker-compose.e2e.yml'] },
  'R-10': { sev: 'Medium', t: 'Một event lỗi chặn cả aggregate',
    d: 'claimRound chỉ cho phép event sớm nhất còn PENDING của mỗi aggregate. Event lỗi giữ backoff (tối đa 300s) và chặn các event sau; alert chỉ nổ khi ≥10 lần thử. FAILED chỉ do operator đặt tay.',
    fix: 'Thêm alert theo tuổi event theo aggregate; công cụ "park event" có audit.',
    src: ['apps/medusa/src/lib/outbox/outbox.ts:92-110', 'infra/observability/alerts.yaml'] },
  'R-11': { sev: 'Medium', t: 'Saga ít bù trừ, dựa vào idempotency + job đối soát',
    d: 'Hầu hết step dùng `wrapStep` không có compensation. Chỉ reserve vật tư, reserve MO, issue vật tư, goods receipt và upload media có bù trừ. Tính nhất quán dựa vào idempotency key, state machine và job reconcile/settle (chỉ đọc + gauge).',
    fix: 'Liệt kê các workflow nhiều bước có side-effect ngoài; bổ sung compensation hoặc runbook sửa tay có audit.',
    src: ['apps/medusa/src/workflows/steps/wrap.ts', 'apps/medusa/src/workflows/steps/manufacturing.ts:163-421'] },
  'R-12': { sev: 'Medium', t: 'Production hiện tại là 1 droplet backend (SPOF) chạy `shared` mode',
    d: 'Postgres, Redis, MinIO, Meilisearch và Medusa (server+worker một process) cùng một droplet. Không có deployment webhook tách riêng nên mất cách ly "webhook storm không làm đói checkout" như thiết kế. Redis kiêm event bus, cache, workflow engine, session.',
    fix: 'Tách Postgres (managed) và chạy server/worker riêng ít nhất ở mức 2 container.',
    src: ['infra/deploy/backend/docker-compose.yml:165', 'docs/deploy-digitalocean.md'] },
  'R-13': { sev: 'High', t: 'Sao lưu: không có PITR ở droplet, MinIO không được backup',
    d: '`deploy.sh backup` chỉ pg_dump hai database (thủ công, không lịch). MinIO (ảnh/video CMS, file Medusa) không nằm trong backup. docs/operations.md nói "Postgres PITR" nhưng điều đó chỉ đúng với managed Postgres (K8s), không đúng với droplet.',
    fix: 'Bật backup/snapshot droplet hoặc chuyển Postgres sang managed; cron pg_dump + đẩy off-host; sao chép bucket MinIO; diễn tập restore.',
    src: ['scripts/deploy.sh:987-999', 'docs/deploy-digitalocean.md §Backups', 'docs/operations.md §Backup'] },
  'R-14': { sev: 'Medium', t: 'Quan sát được còn thiếu: không collector/Grafana/Loki/Alertmanager; storefront không đo',
    d: 'Repo chỉ có PrometheusRule + ServiceMonitor. Không có OTel Collector, dashboard, log shipping, định tuyến alert. Storefront không có Sentry/OTel/metrics. Medusa: @sentry/node ^10 trộn @sentry/opentelemetry-node ^7, tracesSampleRate 1.0, có `@ts-ignore`.',
    fix: 'Bổ sung collector + dashboard + Alertmanager; thêm instrumentation cho storefront; hạ sampling production.',

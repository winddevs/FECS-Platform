# nginx for bibaestudios.com
#
#   bibaestudios.com, www      -> Next.js storefront + Payload CMS admin (:8000)
#   api.bibaestudios.com       -> Medusa API, Medusa Admin (/app), webhooks (:9000)
#
# Install: copy this file to /etc/nginx/conf.d/ and the snippets/ folder to
# /etc/nginx/snippets/. The file lives in the http{} context (conf.d), so the
# zones and maps below are valid here. Steps: docs/deploy-nginx.md.

# ---- shared ----------------------------------------------------------------

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

# Per client address. Webhooks come from Meta and J&T, so the limit is generous
# and only stops floods. Admin sign-in is the brute-force target.
limit_req_zone $binary_remote_addr zone=webhooks:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=cms_login:10m rate=10r/m;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=perip:10m;

upstream storefront {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream medusa {
    server 127.0.0.1:9000;
    keepalive 32;
}

# gzip for text; Medusa already compresses its own responses.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css text/xml application/json application/javascript
           application/xml image/svg+xml;

server_tokens off;

# ---- HTTP: certificates and redirect ---------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name bibaestudios.com www.bibaestudios.com api.bibaestudios.com;

    # Let's Encrypt HTTP-01 challenge (certbot --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- www -> apex -----------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.bibaestudios.com;

    include snippets/tls.conf;
    return 301 https://bibaestudios.com$request_uri;
}

# ---- storefront + Payload CMS ----------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bibaestudios.com;

    include snippets/tls.conf;
    include snippets/security-headers.conf;

    # Media uploads go straight to MinIO (presigned URLs), not through here.
    client_max_body_size 10m;
    limit_conn perip 50;

    # Payload admin and its sign-in API: slow down password guessing.
    location = /admin/login {
        limit_req zone=cms_login burst=10 nodelay;
        include snippets/proxy-common.conf;
        proxy_pass http://storefront;
    }

    location = /api/users/login {
        limit_req zone=cms_login burst=10 nodelay;
        include snippets/proxy-common.conf;
        proxy_pass http://storefront;
    }

    # Hashed build output never changes: let browsers keep it for a year.
    location /_next/static/ {
        include snippets/proxy-common.conf;
        proxy_pass http://storefront;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/security-headers.conf;
    }

    location / {
        include snippets/proxy-common.conf;
        proxy_pass http://storefront;
    }
}

# ---- Medusa API, admin and webhooks ----------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.bibaestudios.com;

    include snippets/tls.conf;
    include snippets/security-headers.conf;

    client_max_body_size 10m;
    limit_conn perip 100;

    # Liveness for the load balancer / uptime monitors. Readiness
    # (/internal/ready) and metrics (/internal/metrics) stay private.
    location = /health {
        access_log off;
        include snippets/proxy-common.conf;
        proxy_pass http://medusa;
    }

    location /internal/ {
        include snippets/internal-only.conf;
        include snippets/proxy-common.conf;
        proxy_pass http://medusa;
    }

    # Meta (Messenger) and J&T call these. The platform verifies the HMAC over
    # the exact bytes, so the body is passed through untouched. 512 KB is plenty.
    location /webhooks/ {
        client_max_body_size 512k;
        limit_req zone=webhooks burst=200 nodelay;
        include snippets/proxy-common.conf;
        proxy_pass http://medusa;
        # Meta retries on a slow answer: the app only stores the event and acks.
        proxy_read_timeout 15s;
    }

    # Back-office sign-in. Customers sign in from the storefront server, not
    # from browsers, so only the admin (user) route is limited per address.
    location = /auth/user/emailpass {
        limit_req zone=admin_login burst=10 nodelay;
        include snippets/proxy-common.conf;
        proxy_pass http://medusa;
    }

    # Medusa Admin and the ERP API. Exports and reconciliations can be slow.
    location ~ ^/(app|admin)(/|$) {
        # To restrict the back-office to your office / VPN, uncomment:
        # allow 203.0.113.10;
        # deny  all;
        proxy_read_timeout 120s;
        include snippets/proxy-common.conf;
        proxy_pass http://medusa;
    }

    location / {
        include snippets/proxy-common.conf;
        proxy_pass http://medusa;
    }
}

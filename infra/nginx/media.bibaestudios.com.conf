# nginx cache in front of MinIO, for public media (images and videos).
#
#   media.bibaestudios.com/<bucket>/cms/media/<file>  -> MinIO (GET/HEAD only)
#
# Uploads do NOT go through here. Payload sends them straight to MinIO with
# presigned URLs (S3_ENDPOINT = the MinIO address). Only reads use this host:
#   S3_FILE_URL=https://media.bibaestudios.com/<bucket>
#
# Why: Payload cannot set Cache-Control on S3 objects, so MinIO answers with no
# caching headers. File names are unique (Payload adds -1, -2 on a clash), so
# an object never changes and can be cached for a year. The cache also keeps
# repeat reads (and video seeks) off MinIO.
#
# Install like bibaestudios.com.conf (conf.d, http{} context). The certificate
# in snippets/tls.conf must also cover media.bibaestudios.com. Needs nginx with
# ngx_http_slice_module (official nginx packages and images have it).

# Set this to the address of the MinIO server (S3 API port, default 9000).
upstream minio-media {
    server 127.0.0.1:9002;
    keepalive 16;
}

# 20 GB on disk, files unused for 30 days are dropped. 50 MB of keys is ~400k objects.
proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:50m
                 max_size=20g inactive=30d use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name media.bibaestudios.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name media.bibaestudios.com;

    include snippets/tls.conf;

    # Read-only, public prefix only. Everything else (console, other buckets,
    # S3 API calls) is closed here.
    location ~ ^/[^/]+/cms/media/ {
        limit_except GET HEAD {
            deny all;
        }

        proxy_pass http://minio-media;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $proxy_host;

        proxy_cache media;
        # Cache big files in 1 MB pieces: a seek in a video only fetches (and
        # stores) the pieces it needs, and a 206 reply is served from cache.
        slice 1m;
        proxy_set_header Range $slice_range;
        proxy_cache_key $uri$slice_range;
        proxy_cache_valid 200 206 30d;
        proxy_cache_valid 404 1m;
        # One request fills a missing piece, the others wait for it.
        proxy_cache_lock on;
        # Keep serving from cache if MinIO is down or slow.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # Store nothing the client could use to tell the S3 server apart.
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Amz-Request-Id;
        proxy_hide_header X-Amz-Id-2;
        proxy_hide_header X-Minio-Deployment-Id;
        proxy_hide_header Server;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        return 404;
    }
}

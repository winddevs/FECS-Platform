# Secrets come from a secret manager, never from Git (NFR-SEC-001).
# Example for External Secrets Operator + AWS Secrets Manager; adapt the
# store/keys for Vault, GCP Secret Manager, etc. Rotation = update the secret,
# the operator refreshes it, then `kubectl rollout restart deploy -l app.kubernetes.io/name=medusa`.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fashion-platform-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: fashion-platform-secrets, creationPolicy: Owner }
  data:
    - { secretKey: DATABASE_URL, remoteRef: { key: fashion/production/database-url } }
    - { secretKey: REDIS_URL, remoteRef: { key: fashion/production/redis-url } }
    - { secretKey: JWT_SECRET, remoteRef: { key: fashion/production/jwt-secret } }
    - { secretKey: COOKIE_SECRET, remoteRef: { key: fashion/production/cookie-secret } }
    - { secretKey: STORE_CORS, remoteRef: { key: fashion/production/store-cors } }
    - { secretKey: ADMIN_CORS, remoteRef: { key: fashion/production/admin-cors } }
    - { secretKey: AUTH_CORS, remoteRef: { key: fashion/production/auth-cors } }
    - { secretKey: METRICS_TOKEN, remoteRef: { key: fashion/production/metrics-token } }
    # Carrier / channel credentials: only the pods that need them read them,
    # and the AI agent never receives them (NFR-SEC-005).
    - { secretKey: JT_API_BASE_URL, remoteRef: { key: fashion/production/jt-api-base-url } }
    - { secretKey: JT_API_ACCOUNT, remoteRef: { key: fashion/production/jt-api-account } }
    - { secretKey: JT_PRIVATE_KEY, remoteRef: { key: fashion/production/jt-private-key } }
    - { secretKey: JT_WEBHOOK_SECRET, remoteRef: { key: fashion/production/jt-webhook-secret } }
    - { secretKey: META_APP_SECRET, remoteRef: { key: fashion/production/meta-app-secret } }
    - { secretKey: META_VERIFY_TOKEN, remoteRef: { key: fashion/production/meta-verify-token } }
    - { secretKey: META_PAGES, remoteRef: { key: fashion/production/meta-pages } }
    - { secretKey: SOCIAL_LINK_SECRET, remoteRef: { key: fashion/production/social-link-secret } }
    # Everything else the configmap says lives in this Secret:
    - { secretKey: S3_ACCESS_KEY_ID, remoteRef: { key: fashion/production/s3-access-key-id } }
    - { secretKey: S3_SECRET_ACCESS_KEY, remoteRef: { key: fashion/production/s3-secret-access-key } }
    - { secretKey: SMTP_PASSWORD, remoteRef: { key: fashion/production/smtp-password } }
    - { secretKey: PAYLOAD_API_KEY, remoteRef: { key: fashion/production/payload-api-key } }
    - { secretKey: ALGOLIA_ADMIN_API_KEY, remoteRef: { key: fashion/production/algolia-admin-api-key } }
    - { secretKey: SENTRY_DSN, remoteRef: { key: fashion/production/sentry-dsn } }

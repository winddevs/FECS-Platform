apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Applied BEFORE the app rollout (CI step or Argo CD PreSync hook). Kept apart
# from base because a Job's pod template is immutable.
resources: [job.yaml]
images:
  - name: fashion-medusa
    newName: ghcr.io/your-org/fashion-medusa
    newTag: latest

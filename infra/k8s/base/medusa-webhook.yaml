# Webhook ingestion (J&T tracking, Meta Messenger). Same image and code as the
# API but a separate Deployment, so a webhook storm (carrier replay, viral
# message spike) can never starve checkout and the admin, and vice versa
# (TDD section 5: scale webhook ingestion independently).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medusa-webhook
  labels: { app.kubernetes.io/name: medusa, app.kubernetes.io/component: webhook }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: medusa, app.kubernetes.io/component: webhook }
  template:
    metadata:
      labels: { app.kubernetes.io/name: medusa, app.kubernetes.io/component: webhook }
    spec:
      serviceAccountName: fashion-medusa
      terminationGracePeriodSeconds: 30
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: medusa
          image: fashion-medusa
          command: ["npx", "medusa", "start"]
          ports: [{ name: http, containerPort: 9000 }]
          env:
            - { name: MEDUSA_WORKER_MODE, value: server }
            # Fewer connections per pod: webhooks only INSERT into the inbox.
            - { name: DB_POOL_MAX, value: "5" }
          envFrom:
            - configMapRef: { name: fashion-platform-config }
            - secretRef: { name: fashion-platform-secrets }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /internal/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          lifecycle:
            preStop: { exec: { command: ["sleep", "10"] } }
---
apiVersion: v1
kind: Service
metadata:
  name: medusa-webhook
spec:
  selector: { app.kubernetes.io/name: medusa, app.kubernetes.io/component: webhook }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: medusa-webhook
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: medusa-webhook }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: medusa-webhook
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: medusa, app.kubernetes.io/component: webhook }

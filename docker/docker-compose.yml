name: ecommerce

services:
  ecommerce-db:
    image: postgres
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: ecommerce_admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ecommerce_medusa
    ports:
      - "5555:5432"
    volumes:
      - ecommerce_postgres_data:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce_admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    volumes:
      - ecommerce_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # S3-compatible object storage for Payload media (images and videos).
  # Built from source, see ./minio/Dockerfile.
  minio:
    build: ./minio
    image: ecommerce-minio:local
    container_name: ecommerce-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Lets the browser upload straight to MinIO from the Payload admin.
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://localhost:8000"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ecommerce_minio_data:/data
    restart: unless-stopped

  # One-shot job: creates the bucket and makes the media prefix publicly readable.
  minio-init:
    image: amazon/aws-cli:2.27.50
    container_name: ecommerce-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./minio/public-read-policy.json:/policy.json:ro
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://minio:9000 s3api head-bucket --bucket ecommerce-media 2>/dev/null ||
      aws --endpoint-url http://minio:9000 s3 mb s3://ecommerce-media;
      aws --endpoint-url http://minio:9000 s3api put-bucket-policy --bucket ecommerce-media --policy file:///policy.json
      "
    restart: "no"

  # Resizes and converts images from MinIO on request (WebP). In production
  # Cloudflare sits in front of it, see docs/deploy-nginx.md.
  # Storefront: NEXT_PUBLIC_IMGPROXY_URL=http://localhost:8081
  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v4.0.17
    container_name: ecommerce-imgproxy
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # Source: MinIO over the S3 API, one bucket and one prefix only.
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      IMGPROXY_S3_REGION: us-east-1
      IMGPROXY_S3_ALLOWED_BUCKETS: ecommerce-media
      # URLs carry only the object key (cms/media/photo.png); imgproxy adds the bucket.
      IMGPROXY_BASE_URL: s3://ecommerce-media/
      IMGPROXY_ALLOWED_SOURCES: s3://ecommerce-media/cms/media/
      # Local only: use a read-only MinIO key in production.
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      # File names may contain "?", so do not read a query string from them.
      IMGPROXY_SOURCE_URL_QUERY_SEPARATOR: ""
      # Only the named presets are accepted, no free-form sizes.
      IMGPROXY_ONLY_PRESETS: "true"
      IMGPROXY_PRESETS_PATH: /config/presets.txt
      # Output: WebP, EXIF removed, caching headers for a year (files never change).
      IMGPROXY_FORMAT_QUALITY: webp=78,avif=60
      IMGPROXY_TTL: "31536000"
      IMGPROXY_USE_ETAG: "true"
      # Limits: huge sources and request pile-ups are refused, not queued forever.
      IMGPROXY_MAX_SRC_RESOLUTION: "50"
      IMGPROXY_MAX_SRC_FILE_SIZE: "52428800"
      IMGPROXY_REQUESTS_QUEUE_SIZE: "200"
    volumes:
      - ./imgproxy/presets.txt:/config/presets.txt:ro
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: ecommerce-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ecommerce.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:z
    restart: unless-stopped

volumes:
  ecommerce_postgres_data:
  ecommerce_redis_data:
  ecommerce_minio_data:

# Prometheus Operator scrape config for the business metrics endpoint.
# /internal/metrics requires `Authorization: Bearer $METRICS_TOKEN`. The token
# is the METRICS_TOKEN key of the platform Secret (see k8s/examples/external-secret.yaml);
# a ServiceMonitor can only read Secrets in its own namespace, so apply this in
# the platform namespace.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: medusa-business-metrics
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: medusa, app.kubernetes.io/component: server }
  endpoints:
    - port: http
      path: /internal/metrics
      interval: 30s
      authorization:
        credentials: { name: fashion-platform-secrets, key: METRICS_TOKEN }

# Public API + admin. Scales on request load.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medusa-server
  labels: { app.kubernetes.io/name: medusa, app.kubernetes.io/component: server }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: medusa, app.kubernetes.io/component: server }
  template:
    metadata:
      labels: { app.kubernetes.io/name: medusa, app.kubernetes.io/component: server }
    spec:
      serviceAccountName: fashion-medusa
      terminationGracePeriodSeconds: 45
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: medusa, app.kubernetes.io/component: server }
      containers:
        - name: medusa
          image: fashion-medusa
          command: ["npx", "medusa", "start"]
          ports: [{ name: http, containerPort: 9000 }]
          env:
            - { name: MEDUSA_WORKER_MODE, value: server }
          envFrom:
            - configMapRef: { name: fashion-platform-config }
            - secretRef: { name: fashion-platform-secrets }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /internal/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            # Let the load balancer drop the pod before the process stops.
            preStop: { exec: { command: ["sleep", "10"] } }
---
apiVersion: v1
kind: Service
metadata:
  name: medusa-server
spec:
  selector: { app.kubernetes.io/name: medusa, app.kubernetes.io/component: server }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: medusa-server
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: medusa-server }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: medusa-server
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: medusa, app.kubernetes.io/component: server }

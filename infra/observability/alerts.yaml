# Alerts for the failure modes in the runbooks (docs/runbooks). Every alert
# links to the runbook section that explains what to do.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fashion-platform
spec:
  groups:
    - name: integrity
      rules:
        - alert: StockInvariantViolated
          expr: fashion_material_balance_invariant_violations > 0 or fashion_fg_balance_invariant_violations > 0
          for: 1m
          labels: { severity: page }
          annotations:
            summary: A stock balance violates reserved+hold+damaged <= on_hand or went negative
            runbook: docs/runbooks/stock-mismatch.md
    - name: delivery
      rules:
        - alert: OutboxLagHigh
          expr: max by (table) (fashion_outbox_oldest_pending_seconds) > 60
          for: 5m
          labels: { severity: page }
          annotations:
            summary: "Outbox {{ $labels.table }} has events older than 60s (SLO p95 < 5s)"
            runbook: docs/runbooks/outbox-backlog.md
        - alert: OutboxEventsFailed
          expr: sum by (table) (fashion_outbox_failed) > 0
          for: 10m
          labels: { severity: ticket }
          annotations:
            summary: "Outbox {{ $labels.table }} has events parked as FAILED"
            runbook: docs/runbooks/outbox-backlog.md
        - alert: OutboxPublishRetriesStuck
          expr: sum by (table) (fashion_outbox_retrying_stuck) > 0
          for: 10m
          labels: { severity: page }
          annotations:
            summary: "Outbox {{ $labels.table }} has events that failed to publish 10+ times (event bus down?)"
            runbook: docs/runbooks/outbox-backlog.md
        - alert: InboxDeadLetters
          expr: sum by (provider) (fashion_inbox_events{status="DLQ"}) > 0
          for: 5m
          labels: { severity: ticket }
          annotations:
            summary: "Inbound {{ $labels.provider }} events are in the dead-letter queue"
            runbook: docs/runbooks/provider-outage.md
    - name: providers
      rules:
        - alert: ShipmentsNotCreated
          expr: sum(fashion_shipments_not_created{create_state=~"UNKNOWN|FAILED_RETRYABLE|PENDING"}) > 10
          for: 15m
          labels: { severity: page }
          annotations:
            summary: Many shipments are waiting for the carrier (outage or credentials?)
            runbook: docs/runbooks/provider-outage.md
        - alert: ShipmentsRejectedByCarrier
          expr: sum(fashion_shipments_not_created{create_state="FAILED_FINAL"}) > 0
          for: 1h
          labels: { severity: ticket }
          annotations:
            summary: Carrier rejected shipments permanently; data needs fixing
            runbook: docs/runbooks/provider-outage.md
        - alert: TrackingStale
          expr: fashion_shipments_stale_tracking > 20
          for: 30m
          labels: { severity: ticket }
          annotations:
            summary: Shipments have had no tracking update for 48h (webhook down? polling disabled?)
            runbook: docs/runbooks/provider-outage.md
    - name: production
      rules:
        - alert: MaterialShortageBlockingProduction
          expr: sum(fashion_production_requests{status="WAITING_MATERIAL"}) > 0
          for: 4h
          labels: { severity: ticket }
          annotations:
            summary: Made-to-order requests have waited 4h for material
            runbook: docs/runbooks/reconciliation-failure.md
        - alert: ManufacturingExceptionsOpen
          expr: fashion_manufacturing_exceptions_open > 5
          for: 1h
          labels: { severity: ticket }
          annotations:
            summary: Fabric variance / overproduction exceptions need review
            runbook: docs/runbooks/reconciliation-failure.md
    - name: slo-latency
      rules:
        # p95 per route group over 10 minutes, from fashion_http_request_duration_ms
        # (TDD section 50). 5xx are excluded so a crash does not look "fast".
        - alert: WebhookAckSlow
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(fashion_http_request_duration_ms_bucket{route=~"/webhooks.*",status!="5xx"}[10m]))) > 500
          for: 10m
          labels: { severity: page }
          annotations:
            summary: Webhook ACK p95 above 500 ms (providers will retry and flood us)
            runbook: docs/runbooks/provider-outage.md
        - alert: AvailabilityQuerySlow
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(fashion_http_request_duration_ms_bucket{route=~"/admin/material-inventory/materials/:id/availability",status!="5xx"}[10m]))) > 200
          for: 10m
          labels: { severity: ticket }
          annotations:
            summary: Availability query p95 above 200 ms
            runbook: docs/runbooks/stock-mismatch.md
        - alert: MaterialReservationSlow
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(fashion_http_request_duration_ms_bucket{method="POST",route="/admin/material-inventory/reservations",status!="5xx"}[10m]))) > 1000
          for: 10m
          labels: { severity: ticket }
          annotations:
            summary: Material reservation p95 above 1 s (hot material? lock contention?)
            runbook: docs/runbooks/stock-mismatch.md
        - alert: ApiErrorRateHigh
          expr: |
            sum(rate(fashion_http_request_duration_ms_count{status="5xx"}[5m])) / sum(rate(fashion_http_request_duration_ms_count[5m])) > 0.01
          for: 10m
          labels: { severity: page }
          annotations:
            summary: More than 1% of API calls fail with 5xx
            runbook: docs/runbooks/provider-outage.md

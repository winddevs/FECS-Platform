# captcha.bibaestudios.com: FCaptcha server (https://github.com/WebDecoy/FCaptcha)
#
#   Browser -> this nginx -> FCaptcha container (127.0.0.1:3100)
#
# The browser loads /fcaptcha.js and calls /api/*. The storefront server checks
# tokens on /turnstile/v0/siteverify, over the local address
# (FCAPTCHA_ORIGIN=http://127.0.0.1:3100), so that path is not published here.
# Install like bibaestudios.com.conf (conf.d, http{} context). Steps and
# environment variables: docs/deploy-nginx.md.
upstream fcaptcha {
    server 127.0.0.1:3100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name captcha.bibaestudios.com;

    # Let's Encrypt HTTP-01 challenge (certbot --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name captcha.bibaestudios.com;

    include snippets/tls.conf;

    # Challenge and verify calls are small JSON bodies.
    client_max_body_size 64k;

    # Widget script and the API the widget calls.
    location = /fcaptcha.js {
        include snippets/proxy-common.conf;
        proxy_pass http://fcaptcha;
    }
    location /api/ {
        include snippets/proxy-common.conf;
        proxy_pass http://fcaptcha;
    }

    # Token checks come from the storefront server over 127.0.0.1, never from
    # the internet. The verify secret is the only credential, but there is no
    # reason to expose the endpoint.
    location / {
        return 404;
    }
}

# img.bibaestudios.com: resized storefront images.
#
#   Browser -> Cloudflare edge (cached?) -> this nginx -> imgproxy -> MinIO
#
#   HIT  at Cloudflare: the browser gets the cached WebP, nothing below runs.
#   MISS at Cloudflare: nginx -> imgproxy reads the original from MinIO, resizes
#        it to WebP, Cloudflare stores the result for a year.
#
# Only reads of /<version>/w<width>/<base64 key>.webp are forwarded; imgproxy
# itself accepts only the width presets in docker/imgproxy/presets.txt and only
# the bucket prefix cms/media/. Install like bibaestudios.com.conf (conf.d,
# http{} context). Steps and Cloudflare settings: docs/deploy-nginx.md.

# imgproxy runs on this host (docker/docker-compose.yml publishes it as 8081).
upstream imgproxy {
    server 127.0.0.1:8081;
    keepalive 16;
}

# Small shield cache: if several Cloudflare locations miss on the same image at
# once, imgproxy resizes it once. 5 GB, files unused for 30 days are dropped.
proxy_cache_path /var/cache/nginx/img levels=1:2 keys_zone=img:20m
                 max_size=5g inactive=30d use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name img.bibaestudios.com;

    # Let's Encrypt HTTP-01 challenge (certbot --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name img.bibaestudios.com;

    include snippets/tls.conf;
    include snippets/cloudflare-only.conf;

    # Version / width preset / base64url object key / format.
    # Anything else (imgproxy status page, other formats, odd paths) is a 404.
    location ~ "^/[A-Za-z0-9_-]{1,32}/w[0-9]{2,4}/[A-Za-z0-9_-]{8,1024}\.webp$" {
        limit_except GET HEAD {
            deny all;
        }

        proxy_pass http://imgproxy;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $proxy_host;

        proxy_cache img;
        proxy_cache_key $uri;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;

        # Resizing a big photo can take a moment; imgproxy gives up at 10 s.
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;

        # The URL carries a version, so a response never changes: keep it a
        # year. Without `always`, nginx adds this to successful answers only,
        # so a 404 is never marked immutable.
        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Server;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status $upstream_cache_status;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        return 404;
    }
}

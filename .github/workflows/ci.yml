# CI gates (TDD section 55). Every gate runs on every PR; the image is built
# and scanned on every PR and pushed only from main.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  MEDUSA_DISABLE_TELEMETRY: "true"

jobs:
  static:
    name: typecheck, events, lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck fashion platform (scoped; the full-project tsc exceeds memory)
        run: pnpm --filter medusa typecheck
      - name: Event catalog is up to date (no unreviewed breaking changes)
        run: pnpm --filter medusa events:check
      # NOTE: non-blocking until the repo's oxlint setup is repaired. With oxlint
      # 1.76 the existing oxlint.config.mjs fails to load ("extends[0] must be a
      # config object"), so `ultracite check` cannot run on ANY code today.
      # Pin a compatible oxlint (or update the config), then remove this flag.
      - name: Lint and format (Ultracite)
        continue-on-error: true
        run: pnpm check

  integration:
    name: integration + HTTP tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: fashion
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/fashion
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter medusa...
      # Stock/FG/shipment invariants, idempotency, concurrency, state machines,
      # MTS/MTO journeys, returns, social policy.
      - run: pnpm --filter medusa test:integration
      # Auth, RBAC, validation, webhooks signature/dedupe over real HTTP.
      - run: pnpm --filter medusa test:http

  migrations:
    name: migrations are generated and apply cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: fashion }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/fashion
      INTEGRATION_TEST: "true"
      JWT_SECRET: ci
      COOKIE_SECRET: ci
      STORE_CORS: http://localhost
      ADMIN_CORS: http://localhost
      AUTH_CORS: http://localhost
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter medusa...
      - name: Apply all migrations to an empty database
        working-directory: apps/medusa
        run: npx medusa db:migrate
      - name: No pending model changes (a model edit must ship its migration)
        working-directory: apps/medusa
        run: |
          npx medusa db:generate integration materialInventory procurement manufacturing quality \
            finishedGoods fashionFulfillment socialCommerce returns
          if [ -n "$(git status --porcelain -- src/modules)" ]; then
            echo "::error::Model changes without a committed migration:"
            git status --porcelain -- src/modules
            exit 1
          fi

  manifests:
    name: kubernetes manifests render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Render every overlay and the migration job
        run: |
          for dir in infra/k8s/overlays/staging infra/k8s/overlays/production infra/k8s/migrate; do
            kubectl kustomize "$dir" > /dev/null
          done
      - name: Validate against the Kubernetes schema
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          for dir in infra/k8s/overlays/staging infra/k8s/overlays/production; do
            kubectl kustomize "$dir" | ./kubeconform -strict -summary -ignore-missing-schemas
          done

  security:
    name: secrets, dependencies, filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter medusa...
      - name: Dependency audit (production, high+)
        run: pnpm audit --prod --audit-level high
      - name: Static analysis (SAST)
        uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3

  image:
    name: build, scan and (on main) publish the image
    runs-on: ubuntu-latest
    needs: [static, integration, migrations]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/medusa.Dockerfile
          load: true
          tags: fashion-medusa:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container scan (fail on fixable high/critical)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fashion-medusa:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push (immutable tag = commit SHA)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/medusa.Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/fashion-medusa:${{ github.sha }}
          cache-from: type=gha

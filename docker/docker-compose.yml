name: ecommerce

services:
  ecommerce-db:
    image: postgres
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: ecommerce_admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ecommerce_medusa
    ports:
      - "5555:5432"
    volumes:
      - ecommerce_postgres_data:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce_admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    volumes:
      - ecommerce_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # S3-compatible object storage for Payload media (images and videos).
  # Built from source, see ./minio/Dockerfile.
  minio:
    build: ./minio
    image: ecommerce-minio:local
    container_name: ecommerce-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Lets the browser upload straight to MinIO from the Payload admin.
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://localhost:8000"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ecommerce_minio_data:/data
    restart: unless-stopped

  # One-shot job: creates the bucket and makes the media prefix publicly readable.
  minio-init:
    image: amazon/aws-cli:2.27.50
    container_name: ecommerce-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./minio/public-read-policy.json:/policy.json:ro
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://minio:9000 s3api head-bucket --bucket ecommerce-media 2>/dev/null ||
      aws --endpoint-url http://minio:9000 s3 mb s3://ecommerce-media;
      aws --endpoint-url http://minio:9000 s3api put-bucket-policy --bucket ecommerce-media --policy file:///policy.json
      "
    restart: "no"

  pgadmin:
    image: dpage/pgadmin4
    container_name: ecommerce-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ecommerce.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:z
    restart: unless-stopped

volumes:
  ecommerce_postgres_data:
  ecommerce_redis_data:
  ecommerce_minio_data:

apiVersion: batch/v1
kind: Job
metadata:
  # Name by release (set by the pipeline, e.g. migrate-<git-sha>) so every
  # deploy creates a fresh Job.
  name: medusa-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/name: medusa, app.kubernetes.io/component: migrate }
    spec:
      restartPolicy: Never
      serviceAccountName: fashion-medusa
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: fashion-medusa
          command: ["npx", "medusa", "db:migrate"]
          envFrom:
            - configMapRef: { name: fashion-platform-config }
            - secretRef: { name: fashion-platform-secrets }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
